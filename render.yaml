# Render.com blueprint — deploy the whole site in a few clicks.
# In Render: New + → "Blueprint" → connect this repo → it reads this file.
databases:
  - name: motsurmaux-db
    plan: free
    databaseName: motsurmaux
    user: motsurmaux

services:
  - type: web
    name: mots-sur-maux
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: motsurmaux-db
          property: connectionString
