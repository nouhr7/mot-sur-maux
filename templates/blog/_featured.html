<article class="featured">
  <div class="featured__media">
    {% if article.cover_image %}
      <img src="{{ article.cover_image.url }}" alt="{{ article.title }}">
    {% endif %}
  </div>
  <div class="featured__body">
    <span class="chip" style="background: {{ article.category.color }}">{{ article.category.name }}</span>
    <h3 class="featured__title"><a href="{{ article.get_absolute_url }}">{{ article.title }}</a></h3>
    <p class="lead">{{ article.excerpt }}</p>
    <div class="article-card__meta">
      <span>{{ article.author_name }}</span>
      <span>·</span>
      <span>{{ article.published_at|date:"j F Y" }}</span>
      <span>·</span>
      <span>{{ article.reading_minutes }} min</span>
    </div>
    <p><a class="btn btn--primary btn--small" href="{{ article.get_absolute_url }}">Lire l'article</a></p>
  </div>
</article>
